<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#050510">
<title>NEON DASH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{user-select:none;-webkit-user-select:none}
button{font:inherit}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:flex}
.background{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#17144b 0%,#080817 38%,#030308 100%)}
.grid{position:absolute;width:200%;height:200%;left:-50%;top:-25%;opacity:.4;background-image:linear-gradient(rgba(91,86,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(91,86,255,.18) 1px,transparent 1px);background-size:55px 55px;transform:perspective(450px) rotateX(62deg);animation:gridMove 7s linear infinite}
@keyframes gridMove{from{transform:perspective(450px) rotateX(62deg) translateY(0)}to{transform:perspective(450px) rotateX(62deg) translateY(55px)}}
.glow{position:absolute;width:550px;height:550px;border-radius:50%;background:#694cff;filter:blur(150px);opacity:.12;left:50%;top:35%;transform:translate(-50%,-50%)}
.stars{position:absolute;inset:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.65;animation:starFloat linear infinite}
@keyframes starFloat{from{transform:translateY(20px);opacity:.1}50%{opacity:.9}to{transform:translateY(-120px);opacity:.1}}
.home-content{position:relative;z-index:5;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{font-size:clamp(55px,10vw,115px);font-weight:1000;font-style:italic;letter-spacing:-5px;color:#fff;text-shadow:0 0 8px #fff,0 0 22px #62f5ff,0 0 55px #714fff;animation:logoPulse 2.4s ease-in-out infinite}
.logo span{color:#63f5ff}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.subtitle{margin-top:8px;font-size:13px;letter-spacing:7px;color:#9ba7ff;text-transform:uppercase}
.menu-buttons{display:flex;flex-direction:column;gap:13px;margin-top:50px;width:min(330px,80vw)}
.neon-button{height:58px;border:2px solid #63f5ff;border-radius:14px;color:#fff;font-size:16px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,rgba(99,245,255,.1),rgba(113,79,255,.18));box-shadow:0 0 18px rgba(99,245,255,.22),inset 0 0 20px rgba(99,245,255,.06);cursor:pointer;transition:.18s}
.neon-button:hover{transform:translateY(-3px) scale(1.02);background:linear-gradient(135deg,rgba(99,245,255,.2),rgba(113,79,255,.3));box-shadow:0 0 28px rgba(99,245,255,.45),inset 0 0 20px rgba(99,245,255,.1)}
.neon-button:active{transform:scale(.97)}
.small-version{position:absolute;bottom:15px;font-size:10px;letter-spacing:3px;color:#62677d}
.level-screen{flex-direction:column;align-items:center;justify-content:center;z-index:10}
.level-header{position:absolute;top:28px;width:100%;text-align:center}
.level-header h1{font-size:36px;font-weight:1000;letter-spacing:4px;text-shadow:0 0 20px #714fff}
.level-header p{margin-top:5px;color:#777c9c;font-size:12px;letter-spacing:3px}
.level-list{width:min(850px,92vw);display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.level-card{position:relative;min-height:190px;padding:22px;border:1px solid #303653;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,rgba(22,25,53,.95),rgba(7,8,20,.95));cursor:pointer;transition:.2s}
.level-card:hover{transform:translateY(-5px);border-color:#63f5ff;box-shadow:0 0 25px #63f5ff22}
.level-number{position:absolute;right:15px;top:5px;font-size:70px;font-weight:1000;color:#ffffff09}
.level-card h2{position:relative;font-size:22px;margin-bottom:8px}
.difficulty{position:relative;font-size:11px;letter-spacing:3px;font-weight:900}
.level-description{position:relative;color:#777d9b;margin-top:15px;font-size:12px;line-height:1.5}
.level-progress{position:relative;margin-top:18px;height:6px;border-radius:10px;background:#15182a;overflow:hidden}
.level-progress div{height:100%;width:0;border-radius:10px}
.locked{opacity:.45;cursor:not-allowed}
.locked:hover{transform:none;border-color:#303653;box-shadow:none}
.back-button{position:absolute;left:25px;top:25px;border:1px solid #3b4260;background:#0b0d1b;color:#fff;border-radius:10px;padding:10px 17px;cursor:pointer;font-weight:800}
#game{background:#050510}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.game-ui{position:absolute;inset:0;pointer-events:none;z-index:20}
.top-ui{position:absolute;top:15px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between}
.ui-pill{min-width:120px;padding:9px 14px;border:1px solid #313955;border-radius:12px;background:rgba(4,5,14,.72);backdrop-filter:blur(10px);font-size:11px;letter-spacing:2px;color:#9ba4c7}
.ui-pill strong{color:#fff;font-size:13px}
.progress-wrap{position:absolute;top:62px;left:50%;width:min(650px,65vw);height:8px;transform:translateX(-50%);border-radius:20px;background:#17192a;border:1px solid #303653;overflow:hidden}
#progressBar{width:0;height:100%;background:linear-gradient(90deg,#63f5ff,#714fff);box-shadow:0 0 15px #63f5ff}
.game-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:auto}
.game-message.show{display:block}
.game-message h1{font-size:clamp(42px,8vw,90px);font-weight:1000;font-style:italic;letter-spacing:-3px;text-shadow:0 0 15px #fff,0 0 35px #63f5ff}
.game-message p{margin-top:10px;font-size:12px;color:#a7aecb;letter-spacing:3px}
.game-controls{position:absolute;bottom:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
.game-control-button{border:1px solid #303753;border-radius:11px;background:rgba(5,7,18,.75);color:#ccd2ef;padding:10px 14px;cursor:pointer;font-size:11px;letter-spacing:2px;font-weight:900}
.mobile-control{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);z-index:30;width:150px;height:75px;border:2px solid #63f5ff;border-radius:18px;background:linear-gradient(135deg,rgba(99,245,255,.16),rgba(113,79,255,.2));color:#fff;font-size:17px;font-weight:1000;letter-spacing:3px;box-shadow:0 0 25px #63f5ff55,inset 0 0 20px #63f5ff18;touch-action:none;user-select:none;cursor:pointer;pointer-events:auto}
.mobile-control:active{transform:translateX(-50%) scale(.95)}
.modal{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.modal.show{display:flex}
.modal-box{width:min(430px,90vw);border:1px solid #3a4262;border-radius:20px;padding:30px;background:linear-gradient(145deg,#101329,#070812);box-shadow:0 0 50px #000}
.modal-box h2{font-size:28px;letter-spacing:3px;margin-bottom:25px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid #20253b}
.setting span{font-weight:800}
.setting small{display:block;color:#6e7592;font-size:10px;margin-top:5px}
.toggle{width:52px;height:28px;border-radius:20px;background:#292d40;padding:4px;cursor:pointer}
.toggle div{width:20px;height:20px;border-radius:50%;background:#777d99;transition:.2s}
.toggle.on{background:#63f5ff33}
.toggle.on div{transform:translateX(24px);background:#63f5ff;box-shadow:0 0 12px #63f5ff}
.modal-close{width:100%;margin-top:25px}
.toast{position:absolute;left:50%;top:88px;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:200;padding:11px 18px;border:1px solid #63f5ff;border-radius:12px;background:rgba(5,7,18,.92);box-shadow:0 0 25px #63f5ff33;letter-spacing:2px;font-size:11px;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ============================================================
   NEON DASH VISUAL UPGRADE
   ============================================================ */
body{
    background:radial-gradient(circle at 50% 25%,#111a4b 0%,#050510 55%,#010106 100%);
}
.level-card{
    background:linear-gradient(145deg,rgba(35,40,82,.94),rgba(8,10,28,.98));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -25px 60px rgba(0,0,0,.25),0 12px 35px rgba(0,0,0,.35);
}
.level-card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:20px;
    pointer-events:none;
    background:linear-gradient(120deg,transparent 15%,rgba(99,245,255,.13) 35%,transparent 55%,rgba(255,56,216,.11) 75%,transparent 90%);
}
.neon-button{
    position:relative;
    overflow:hidden;
}
.neon-button::after{
    content:"";
    position:absolute;
    top:0;
    left:-130%;
    width:70%;
    height:100%;
    transform:skewX(-22deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
    transition:left .55s ease;
}
.neon-button:hover::after{left:150%}
.progress-wrap{
    box-shadow:0 0 18px rgba(99,245,255,.1),inset 0 0 8px rgba(0,0,0,.5);
}
#progressBar{
    background:linear-gradient(90deg,#00eaff,#714fff,#ff38d8,#ffd52f);
}
.game-message{
    padding:30px 45px;
    border:1px solid rgba(99,245,255,.2);
    border-radius:24px;
    background:rgba(3,5,17,.52);
    box-shadow:inset 0 0 35px rgba(99,245,255,.04),0 20px 70px rgba(0,0,0,.45);
    backdrop-filter:blur(7px);
}
.difficulty{text-shadow:0 0 12px currentColor}
.ui-pill{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 25px rgba(0,0,0,.22);
}
.mobile-control{
    background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.15),transparent 40%),
    linear-gradient(135deg,rgba(0,234,255,.22),rgba(113,79,255,.3),rgba(255,56,216,.18));
}
/* ============================================================
   END VISUAL UPGRADE
   ============================================================ */

@media(max-width:700px){
.level-list{grid-template-columns:1fr;width:min(430px,90vw);max-height:75vh;overflow-y:auto;padding:10px}
.level-card{min-height:145px}
.level-header{top:20px}
.level-header h1{font-size:27px}
.back-button{top:15px;left:15px}
.progress-wrap{width:58vw}
.ui-pill{min-width:auto;padding:8px 10px;font-size:9px}
.mobile-control{bottom:65px}
}
@media(min-width:701px){.mobile-control{display:none}}
</style>
</head>
<body>

<section id="home" class="screen active">
<div class="background"><div class="grid"></div><div class="glow"></div><div class="stars" id="homeStars"></div></div>
<div class="home-content">
<div class="logo">NEON <span>DASH</span></div>
<div class="subtitle">RUN • JUMP • SURVIVE</div>
<div class="menu-buttons">
<button class="neon-button" id="playButton">PLAY</button>
<button class="neon-button" id="settingsButton">SETTINGS</button>
</div>
<div class="small-version">NEON DASH • ORIGINAL EDITION</div>
</div>
</section>

<section id="levels" class="screen level-screen">
<div class="background"><div class="grid"></div><div class="glow"></div><div class="stars" id="levelStars"></div></div>
<button class="back-button" id="levelsBack">← BACK</button>
<div class="level-header"><h1>SELECT LEVEL</h1><p>MASTER THE NEON</p></div>
<div class="level-list" id="levelList"></div>
</section>

<section id="game" class="screen">
<canvas id="gameCanvas"></canvas>
<div class="game-ui">
<div class="top-ui">
<div class="ui-pill">LEVEL: <strong id="gameLevelName">CYBER START</strong></div>
<div class="ui-pill">ATTEMPT: <strong id="attemptDisplay">1</strong></div>
</div>
<div class="progress-wrap"><div id="progressBar"></div></div>
<div class="game-message" id="gameMessage"><h1 id="messageTitle">CRASH!</h1><p id="messageText">PRESS SPACE OR TAP TO TRY AGAIN</p></div>
<div class="game-controls">
<button class="game-control-button" id="restartButton">RESTART</button>
<button class="game-control-button" id="quitButton">QUIT</button>
</div>

</div>
</section>

<div class="modal" id="settingsModal">
<div class="modal-box">
<h2>SETTINGS</h2>
<div class="setting"><div><span>Sound</span><small>Game sound effects</small></div><div class="toggle on" id="soundToggle"><div></div></div></div>
<div class="setting"><div><span>Music</span><small>Neon Dash level music</small></div><div class="toggle on" id="musicToggle"><div></div></div></div>
<div class="setting"><div><span>Reduced Motion</span><small>Reduce background animations</small></div><div class="toggle" id="motionToggle"><div></div></div></div>
<button class="neon-button modal-close" id="closeSettings">DONE</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   NEON DASH - FULL SINGLE FILE EDITION
   ============================================================ */

const SAVE_KEY="neonDashSave";

const defaultSave={
level:1,
stars:0,
attempts:0,
best:{}
};

let save={...defaultSave,best:{}};

try{
const stored=localStorage.getItem(SAVE_KEY);
if(stored){
const parsed=JSON.parse(stored);
save={...defaultSave,...parsed,best:{...(parsed.best||{})}};
}
}catch(error){}

function saveGame(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(save));
}catch(error){}
}

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const home=document.getElementById("home");
const levelsScreen=document.getElementById("levels");
const gameScreen=document.getElementById("game");

const playButton=document.getElementById("playButton");
const settingsButton=document.getElementById("settingsButton");
const levelsBack=document.getElementById("levelsBack");

const levelList=document.getElementById("levelList");

const restartButton=document.getElementById("restartButton");
const quitButton=document.getElementById("quitButton");
const jumpButton=document.getElementById("jumpButton");

const progressBar=document.getElementById("progressBar");
const gameLevelName=document.getElementById("gameLevelName");
const attemptDisplay=document.getElementById("attemptDisplay");

const gameMessage=document.getElementById("gameMessage");
const messageTitle=document.getElementById("messageTitle");
const messageText=document.getElementById("messageText");

const settingsModal=document.getElementById("settingsModal");
const soundToggle=document.getElementById("soundToggle");
const musicToggle=document.getElementById("musicToggle");
const motionToggle=document.getElementById("motionToggle");
const closeSettings=document.getElementById("closeSettings");

const toast=document.getElementById("toast");

const levelsData=[
{id:1,name:"CYBER START",difficulty:"EASY",color:"#714fff",speed:6,length:5200},
{id:2,name:"ELECTRIC SKY",difficulty:"NORMAL",color:"#00eaff",speed:7,length:6000},
{id:3,name:"VOID REACTOR",difficulty:"HARD",color:"#ff38d8",speed:7.5,length:6600},
{id:4,name:"HYPER DRIVE",difficulty:"VERY HARD",color:"#ff6b2d",speed:9,length:7300},
{id:5,name:"GALAXY CORE",difficulty:"INSANE",color:"#55ff78",speed:9.5,length:7900},
{id:6,name:"FINAL PULSE",difficulty:"EXTREME",color:"#ffd52f",speed:10,length:8800}
];

let currentLevel=1;
let levelData=null;
let running=false;
let dead=false;
let won=false;
let cameraX=0;
let lastTime=0;
let jumpBuffer=0;
let coyoteTime=0;
let jumpHeld=false;
let particles=[];
let obstacles=[];
let screenShake=0;
let reducedMotion=false;
let soundEnabled=true;
try{soundEnabled=localStorage.getItem("neonDashSound")!=="off";}catch(e){}
let musicEnabled=true;
try{musicEnabled=localStorage.getItem("neonDashMusic")!=="off";}catch(e){}
let musicVolume=0.18;
let audioCtx=null;
let musicTimer=null;
let musicStep=0;
let musicRunId=0;

/* ============================================================
   NEON DASH BUILT-IN MUSIC ENGINE
   Original Web Audio synth music — no external audio files.
   Each level gets its own electronic/synthwave pattern.
============================================================ */
const musicTracks={
1:{tempo:132,wave:"triangle",bass:"sawtooth",notes:[
  [261.63,329.63,392.00],[293.66,369.99,440.00],[329.63,392.00,493.88],[293.66,349.23,440.00],
  [261.63,329.63,392.00],[220.00,293.66,349.23],[246.94,329.63,392.00],[293.66,369.99,440.00]
]},
2:{tempo:142,wave:"square",bass:"sawtooth",notes:[
  [329.63,415.30,493.88],[392.00,493.88,587.33],[440.00,554.37,659.25],[392.00,493.88,587.33],
  [329.63,415.30,493.88],[293.66,369.99,440.00],[329.63,392.00,493.88],[392.00,493.88,587.33]
]},
3:{tempo:128,wave:"sawtooth",bass:"square",notes:[
  [164.81,196.00,246.94],[146.83,174.61,220.00],[164.81,207.65,246.94],[130.81,164.81,196.00],
  [164.81,196.00,246.94],[174.61,220.00,261.63],[146.83,184.99,220.00],[164.81,207.65,246.94]
]},
4:{tempo:154,wave:"square",bass:"sawtooth",notes:[
  [392.00,493.88,587.33],[440.00,554.37,659.25],[493.88,622.25,739.99],[440.00,554.37,659.25],
  [392.00,493.88,587.33],[329.63,415.30,493.88],[369.99,466.16,554.37],[440.00,554.37,659.25]
]},
5:{tempo:136,wave:"triangle",bass:"sine",notes:[
  [261.63,329.63,523.25],[293.66,369.99,587.33],[329.63,415.30,659.25],[246.94,329.63,493.88],
  [261.63,392.00,523.25],[293.66,440.00,587.33],[329.63,493.88,659.25],[392.00,523.25,783.99]
]},
6:{tempo:168,wave:"sawtooth",bass:"square",notes:[
  [329.63,415.30,659.25],[392.00,493.88,783.99],[440.00,554.37,880.00],[493.88,622.25,987.77],
  [440.00,554.37,880.00],[392.00,493.88,783.99],[329.63,415.30,659.25],[293.66,369.99,739.99]
]}
};

function ensureAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return true;
  }catch(e){return false;}
}

function stopMusic(){
  musicRunId++;
  if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}
}

function playMusicTone(freq,duration,type,volume,when){
  if(!audioCtx)return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  const filter=audioCtx.createBiquadFilter();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,when);
  filter.type='lowpass';
  filter.frequency.setValueAtTime(type==='sawtooth'?1700:2600,when);
  gain.gain.setValueAtTime(0.0001,when);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001,volume),when+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,when+duration*.92);
  osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
  osc.start(when);
  osc.stop(when+duration);
}

function playKick(when){
  if(!audioCtx)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(120,when);
  osc.frequency.exponentialRampToValueAtTime(48,when+.11);
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(.16*musicVolume/0.18,when+.004);
  gain.gain.exponentialRampToValueAtTime(.0001,when+.13);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(when);osc.stop(when+.14);
}

function scheduleMusicStep(runId){
  if(runId!==musicRunId||!running||!musicEnabled||!soundEnabled||!levelData)return;
  if(!ensureAudio())return;
  const track=musicTracks[levelData.id]||musicTracks[1];
  const beat=60/track.tempo;
  const now=audioCtx.currentTime+.03;
  const chord=track.notes[musicStep%track.notes.length];
  const beatInBar=musicStep%4;
  chord.forEach((freq,i)=>playMusicTone(freq,beat*.92,track.wave,musicVolume*(i===0?.07:.045),now));
  const bassFreq=chord[0]/2;
  playMusicTone(bassFreq,beat*.78,track.bass,musicVolume*.12,now);
  if(beatInBar===0||beatInBar===2)playKick(now);
  musicStep++;
  musicTimer=setTimeout(()=>scheduleMusicStep(runId),Math.max(35,(beat*1000)-8));
}

function startMusic(){
  stopMusic();
  if(!musicEnabled||!soundEnabled||!running)return;
  if(!ensureAudio())return;
  musicStep=0;
  const runId=musicRunId;
  scheduleMusicStep(runId);
}

let animationFrame=0;
let gameRunId=0;

const player={
x:220,
y:0,
size:38,
vy:0,
grounded:false,
rotation:0
};

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
if(gameScreen.classList.contains("active")&&levelData&&!running&&!dead&&!won){
player.y=canvas.height*.78-player.size;
}
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function showScreen(screen){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
screen.classList.add("active");
}

function showToast(message){
toast.textContent=message;
toast.classList.add("show");
clearTimeout(showToast.timer);
showToast.timer=setTimeout(()=>toast.classList.remove("show"),1600);
}

function createStars(id,count){
const container=document.getElementById(id);
if(!container)return;
container.innerHTML="";
if(reducedMotion)return;
for(let i=0;i<count;i++){
const star=document.createElement("div");
star.className="star";
star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";
star.style.animationDuration=(3+Math.random()*6)+"s";
star.style.animationDelay=(-Math.random()*8)+"s";
star.style.opacity=.15+Math.random()*.75;
container.appendChild(star);
}
}

createStars("homeStars",100);
createStars("levelStars",80);

function buildLevelList(){
levelList.innerHTML="";
levelsData.forEach(level=>{
const unlocked=true;
const best=save.best[level.id]||0;
const card=document.createElement("div");
card.className="level-card"+(unlocked?"":" locked");
card.innerHTML=`
<div class="level-number">${level.id}</div>
<h2>${level.name}</h2>
<div class="difficulty" style="color:${level.color}">${level.difficulty}</div>
<div class="level-description">${unlocked?"Jump through obstacles and reach the finish.":"Complete previous levels to unlock."}</div>
<div class="level-progress"><div style="width:${best}%;background:${level.color};box-shadow:0 0 10px ${level.color}"></div></div>
`;
if(unlocked){
card.addEventListener("click",()=>startLevel(level.id));
}
levelList.appendChild(card);
});
}

function generateLevel(level){
obstacles=[];
const groundY=canvas.height*.78;
let x=650;
let pattern=0;
const end=level.length-350;

while(x<end){
pattern++;
const choice=pattern%12;

if(choice===1){
obstacles.push({type:"spike",x,y:groundY-34,w:34,h:34});
x+=240;
}else if(choice===2){
obstacles.push({type:"spike",x,y:groundY-34,w:34,h:34});
obstacles.push({type:"spike",x:x+42,y:groundY-34,w:34,h:34});
x+=300;
}else if(choice===3){
obstacles.push({type:"block",x,y:groundY-55,w:55,h:55});
x+=300;
}else if(choice===4){
obstacles.push({type:"block",x,y:groundY-80,w:75,h:80});
x+=350;
}else if(choice===5){
obstacles.push({type:"spike",x,y:groundY-34,w:34,h:34});
obstacles.push({type:"spike",x:x+115,y:groundY-34,w:34,h:34});
x+=350;
}else if(choice===6){
obstacles.push({type:"block",x,y:groundY-45,w:120,h:45});
x+=350;
}else if(choice===7){
obstacles.push({type:"block",x,y:groundY-70,w:60,h:70});
obstacles.push({type:"spike",x:x+100,y:groundY-34,w:34,h:34});
x+=370;
}else if(choice===8){
obstacles.push({type:"spike",x,y:groundY-34,w:34,h:34});
obstacles.push({type:"spike",x:x+42,y:groundY-34,w:34,h:34});
obstacles.push({type:"spike",x:x+84,y:groundY-34,w:34,h:34});
x+=410;
}else if(choice===9){
obstacles.push({type:"block",x,y:groundY-100,w:65,h:100});
obstacles.push({type:"spike",x:x+100,y:groundY-34,w:34,h:34});
obstacles.push({type:"spike",x:x+142,y:groundY-34,w:34,h:34});
x+=410;
}else if(choice===10){
obstacles.push({type:"spike",x,y:groundY-34,w:34,h:34});
obstacles.push({type:"block",x:x+100,y:groundY-55,w:55,h:55});
x+=390;
}else if(choice===11){
obstacles.push({type:"block",x,y:groundY-75,w:65,h:75});
obstacles.push({type:"block",x:x+130,y:groundY-45,w:100,h:45});
x+=430;
}else{
x+=300;
}
}
}

function startLevel(id){
levelData=levelsData.find(l=>l.id===id);
if(!levelData)return;

currentLevel=id;
showScreen(gameScreen);

running=true;
dead=false;
won=false;

ensureAudio();
startMusic();

cameraX=0;
player.x=220;
player.y=canvas.height*.78-player.size;
player.vy=0;
player.grounded=true;

/* SLOWER ROTATION STARTS UPRIGHT */
player.rotation=0;

jumpBuffer=0;
coyoteTime=5;
jumpHeld=false;
particles=[];
screenShake=0;

generateLevel(levelData);

gameLevelName.textContent=levelData.name;

save.attempts++;
attemptDisplay.textContent=save.attempts;

progressBar.style.width="0%";
gameMessage.classList.remove("show");

gameRunId++;
lastTime=performance.now();

cancelAnimationFrame(animationFrame);
animationFrame=requestAnimationFrame(gameLoop);
}

function requestJump(){
if(dead){
startLevel(currentLevel);
return;
}
if(won){
buildLevelList();
showScreen(levelsScreen);
return;
}
if(!running)return;
jumpBuffer=7;
}

function updatePlayer(){
if(!running)return;

const groundY=canvas.height*.78;

if(jumpBuffer>0)jumpBuffer--;
if(coyoteTime>0)coyoteTime--;

player.x+=levelData.speed;

if(jumpBuffer>0&&(player.grounded||coyoteTime>0)){
player.vy=-15.5;
player.grounded=false;
jumpBuffer=0;
coyoteTime=0;
createJumpParticles();
}

player.vy+=.82;
player.y+=player.vy;

if(player.y+player.size>=groundY){
player.y=groundY-player.size;
player.vy=0;
if(!player.grounded)createLandingParticles();
player.grounded=true;
coyoteTime=5;
}else{
player.grounded=false;
}

/*
============================================================
SLOW CUBE ROTATION
============================================================
The cube still spins in the air, but much less than before.
The 0.055 value keeps the movement visible without making the
character rotate excessively.
============================================================
*/
if(!player.grounded){
player.rotation+=0.055;
}else{
const quarter=Math.PI/2;
const target=Math.round(player.rotation/quarter)*quarter;
player.rotation+=(target-player.rotation)*0.2;
}

const targetCamera=player.x-canvas.width*.25;
cameraX+=(targetCamera-cameraX)*.1;
if(cameraX<0)cameraX=0;

checkCollisions();

if(player.x>=levelData.length){
completeLevel();
}

const progress=Math.min(100,player.x/levelData.length*100);
progressBar.style.width=progress+"%";

const oldBest=save.best[currentLevel]||0;
if(progress>oldBest){
save.best[currentLevel]=Math.floor(progress);
saveGame();
}
}

function checkCollisions(){
const px=player.x;
const py=player.y;
const ps=player.size;

for(const obstacle of obstacles){
if(px<obstacle.x+obstacle.w&&px+ps>obstacle.x&&py<obstacle.y+obstacle.h&&py+ps>obstacle.y){
if(obstacle.type==="spike"){
die();
return;
}

if(obstacle.type==="block"){
const previousBottom=py+ps-player.vy;
if(previousBottom<=obstacle.y&&player.vy>=0){
player.y=obstacle.y-ps;
player.vy=0;
player.grounded=true;
coyoteTime=5;
}else{
die();
return;
}
}
}
}
}

function die(){
if(dead||won)return;
dead=true;
running=false;
stopMusic();
createDeathParticles();
screenShake=14;
messageTitle.textContent="CRASH!";
messageText.textContent="PRESS SPACE, TAP, OR JUMP TO TRY AGAIN";
gameMessage.classList.add("show");
saveGame();
}

function completeLevel(){
if(won)return;
won=true;
running=false;
stopMusic();
createWinParticles();
messageTitle.textContent="LEVEL COMPLETE!";
messageText.textContent="PRESS SPACE OR TAP TO RETURN TO LEVELS";
gameMessage.classList.add("show");
save.best[currentLevel]=100;
if(currentLevel===save.level&&save.level<levelsData.length)save.level++;
save.stars++;
saveGame();
}

function addParticle(x,y,vx,vy,life,size,color){
particles.push({x,y,vx,vy,life,maxLife:life,size,color});
}

function createJumpParticles(){
for(let i=0;i<9;i++){
addParticle(player.x+player.size/2,player.y+player.size,(Math.random()-.5)*3,Math.random()*2+1,25+Math.random()*15,3+Math.random()*4,levelData.color);
}
}

function createLandingParticles(){
for(let i=0;i<6;i++){
addParticle(player.x+player.size/2,player.y+player.size,(Math.random()-.5)*3,Math.random(),20+Math.random()*10,2+Math.random()*3,"#fff");
}
}

function createDeathParticles(){
for(let i=0;i<35;i++){
addParticle(player.x+player.size/2,player.y+player.size/2,(Math.random()-.5)*12,(Math.random()-.5)*12,30+Math.random()*40,3+Math.random()*7,i%2?levelData.color:"#fff");
}
}

function createWinParticles(){
for(let i=0;i<70;i++){
addParticle(player.x+player.size/2,player.y+player.size/2,(Math.random()-.5)*15,(Math.random()-.5)*15,40+Math.random()*50,3+Math.random()*7,i%2?levelData.color:"#63f5ff");
}
}

function updateParticles(){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.vy+=.12;
p.life--;
if(p.life<=0)particles.splice(i,1);
}
}

function drawBackground(){
const w=canvas.width;
const h=canvas.height;
const groundY=h*.78;

ctx.fillStyle="#02030a";
ctx.fillRect(0,0,w,h);

/* Deep multi-color sky */
const sky=ctx.createLinearGradient(0,0,0,h);
sky.addColorStop(0,"#090b2b");
sky.addColorStop(.25,"#11144a");
sky.addColorStop(.55,"#080b25");
sky.addColorStop(1,"#02030b");
ctx.fillStyle=sky;
ctx.fillRect(0,0,w,h);

/* Colored atmospheric glows */
const atmospheres=[
{x:.18,y:.25,r:.55,c:levelData.color,a:.16},
{x:.78,y:.18,r:.48,c:"#00eaff",a:.09},
{x:.55,y:.48,r:.6,c:"#ff38d8",a:.055}
];

for(const a of atmospheres){
    const g=ctx.createRadialGradient(
        w*a.x,h*a.y,10,w*a.x,h*a.y,h*a.r
    );
    const alpha=Math.floor(a.a*255).toString(16).padStart(2,"0");
    g.addColorStop(0,a.c+alpha);
    g.addColorStop(1,"transparent");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
}

/* Distant stars */
for(let i=0;i<130;i++){
    const sx=((i*137-cameraX*.08)%(w+120)+w+120)%(w+120)-60;
    const sy=(i*73)%(h*.65);
    const size=i%17===0?3:i%5===0?2:1;
    ctx.globalAlpha=.18+(i%9)/12;
    ctx.fillStyle=i%13===0?"#63f5ff":i%17===0?"#ff72ed":"#ffffff";
    ctx.fillRect(sx,sy,size,size);
}
ctx.globalAlpha=1;

/* Distant skyline for extra depth */
const skylineOffset=-(cameraX*.16%180);
for(let x=skylineOffset-180;x<w+180;x+=45){
    const bh=25+((Math.abs(Math.floor(x))*13)%95);
    ctx.fillStyle="#07091a";
    ctx.fillRect(x,groundY-bh,36,bh);
    ctx.fillStyle=levelData.color;
    ctx.globalAlpha=.16;
    for(let wy=groundY-bh+10;wy<groundY-8;wy+=14){
        if(Math.floor((x+wy)/17)%3===0){
            ctx.fillRect(x+8,wy,4,5);
            ctx.fillRect(x+20,wy,4,5);
        }
    }
    ctx.globalAlpha=1;
}

/* Horizon haze */
const horizon=ctx.createLinearGradient(0,groundY-130,0,groundY+30);
horizon.addColorStop(0,"transparent");
horizon.addColorStop(.7,levelData.color+"18");
horizon.addColorStop(1,levelData.color+"08");
ctx.fillStyle=horizon;
ctx.fillRect(0,groundY-130,w,160);

/* Ground */
ctx.fillStyle="#050717";
ctx.fillRect(0,groundY,w,h-groundY);

ctx.fillStyle="#0b1030";
ctx.fillRect(0,groundY+4,w,7);

ctx.fillStyle=levelData.color;
ctx.globalAlpha=.85;
ctx.shadowColor=levelData.color;
ctx.shadowBlur=22;
ctx.fillRect(0,groundY,w,3);
ctx.shadowBlur=0;
ctx.globalAlpha=1;

/* Perspective floor */
ctx.strokeStyle="#26305b";
ctx.lineWidth=1;
ctx.globalAlpha=.65;

const gridSize=52;
const offset=-(cameraX%gridSize);

for(let x=offset;x<w;x+=gridSize){
    ctx.beginPath();
    ctx.moveTo(x,groundY);
    ctx.lineTo(x-55,h);
    ctx.stroke();
}
for(let y=groundY+28;y<h;y+=28){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
}
ctx.globalAlpha=1;

/* Moving neon floor accents */
for(let i=0;i<18;i++){
    const ax=((i*145-cameraX*.65)%(w+180)+w+180)%(w+180)-90;
    ctx.fillStyle=i%3===0?"#00eaff":i%3===1?levelData.color:"#ff38d8";
    ctx.globalAlpha=.3;
    ctx.fillRect(ax,groundY+12,55,2);
}
ctx.globalAlpha=1;

/* Floating atmosphere particles */
for(let i=0;i<26;i++){
    const fx=((i*211-cameraX*.32)%(w+100)+w+100)%(w+100)-50;
    const fy=80+(i*97)%(groundY-120);
    ctx.fillStyle=i%2?"#63f5ff":"#ff38d8";
    ctx.globalAlpha=.12;
    ctx.beginPath();
    ctx.arc(fx,fy,1.5,0,Math.PI*2);
    ctx.fill();
}
ctx.globalAlpha=1;
}

function drawObstacles(){
for(const obstacle of obstacles){
const x=obstacle.x-cameraX;
if(x<-180||x>canvas.width+180)continue;

if(obstacle.type==="block"){
ctx.save();

const outer=ctx.createLinearGradient(
    x,obstacle.y,x+obstacle.w,obstacle.y+obstacle.h
);
outer.addColorStop(0,"#ffffff");
outer.addColorStop(.04,levelData.color);
outer.addColorStop(.48,"#20254d");
outer.addColorStop(1,"#080a19");

ctx.shadowColor=levelData.color;
ctx.shadowBlur=18;
ctx.fillStyle=outer;
ctx.fillRect(x,obstacle.y,obstacle.w,obstacle.h);

ctx.shadowBlur=0;
ctx.strokeStyle="#ffffff88";
ctx.lineWidth=2;
ctx.strokeRect(x,obstacle.y,obstacle.w,obstacle.h);

if(obstacle.w>35&&obstacle.h>35){
    ctx.strokeStyle=levelData.color+"88";
    ctx.lineWidth=2;
    ctx.strokeRect(x+7,obstacle.y+7,obstacle.w-14,obstacle.h-14);
    ctx.fillStyle="#ffffff12";
    ctx.fillRect(x+8,obstacle.y+8,Math.max(2,obstacle.w-16),7);
}

ctx.fillStyle="#ffffff";
ctx.globalAlpha=.75;
ctx.fillRect(x+4,obstacle.y+4,4,4);
ctx.fillRect(x+obstacle.w-8,obstacle.y+4,4,4);
ctx.globalAlpha=1;
ctx.restore();
}

if(obstacle.type==="spike"){
ctx.save();
ctx.translate(x,obstacle.y+obstacle.h);

ctx.shadowColor=levelData.color;
ctx.shadowBlur=20;

const spike=ctx.createLinearGradient(0,-obstacle.h,obstacle.w,0);
spike.addColorStop(0,"#ffffff");
spike.addColorStop(.12,levelData.color);
spike.addColorStop(.58,"#714fff");
spike.addColorStop(1,"#0a0c20");

ctx.fillStyle=spike;
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(obstacle.w/2,-obstacle.h);
ctx.lineTo(obstacle.w,0);
ctx.closePath();
ctx.fill();

ctx.shadowBlur=0;
ctx.strokeStyle="#ffffffaa";
ctx.lineWidth=1.5;
ctx.stroke();

ctx.strokeStyle="#ffffff33";
ctx.beginPath();
ctx.moveTo(obstacle.w/2,-obstacle.h+6);
ctx.lineTo(obstacle.w/2,0);
ctx.stroke();

ctx.restore();
}
}
}

function drawPlayer(){
const x=player.x-cameraX;
const y=player.y;
const s=player.size;

ctx.save();
ctx.translate(x+s/2,y+s/2);
ctx.rotate(player.rotation);

ctx.shadowColor="#63f5ff";
ctx.shadowBlur=24;

const gradient=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);
gradient.addColorStop(0,"#ffffff");
gradient.addColorStop(.18,"#63f5ff");
gradient.addColorStop(.52,"#714fff");
gradient.addColorStop(.82,"#ff38d8");
gradient.addColorStop(1,"#ffd52f");
ctx.fillStyle=gradient;
ctx.fillRect(-s/2,-s/2,s,s);

ctx.shadowBlur=0;

ctx.fillStyle="#0a0d20";
ctx.fillRect(-s/2+6,-s/2+6,s-12,s-12);

ctx.fillStyle="#63f5ff";
ctx.fillRect(-10,-8,6,8);
ctx.fillRect(4,-8,6,8);
ctx.fillRect(-8,7,16,4);

ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.strokeRect(-s/2,-s/2,s,s);

ctx.restore();
}

function drawParticles(){
for(const p of particles){
ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
ctx.fillStyle=p.color;
ctx.shadowColor=p.color;
ctx.shadowBlur=10;
ctx.fillRect(p.x-cameraX,p.y,p.size,p.size);
}
ctx.globalAlpha=1;
ctx.shadowBlur=0;
}

function drawFinish(){
if(!levelData)return;

const x=levelData.length-cameraX;
const groundY=canvas.height*.78;

if(x<-100||x>canvas.width+100)return;

ctx.save();

ctx.shadowColor=levelData.color;
ctx.shadowBlur=25;

ctx.strokeStyle=levelData.color;
ctx.lineWidth=5;

ctx.beginPath();
ctx.moveTo(x,groundY);
ctx.lineTo(x,groundY-210);
ctx.stroke();

ctx.fillStyle=levelData.color;
ctx.beginPath();
ctx.moveTo(x,groundY-210);
ctx.lineTo(x+90,groundY-175);
ctx.lineTo(x,groundY-140);
ctx.closePath();
ctx.fill();

ctx.restore();
}

function gameLoop(timestamp){
if(!gameScreen.classList.contains("active"))return;

const delta=Math.min(32,timestamp-lastTime);
lastTime=timestamp;

if(running)updatePlayer();
updateParticles();

ctx.save();

if(screenShake>0){
ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
screenShake*=.88;
if(screenShake<.2)screenShake=0;
}

drawBackground();
drawFinish();
drawObstacles();
drawParticles();
drawPlayer();

ctx.restore();

if(running||particles.length>0){
animationFrame=requestAnimationFrame(gameLoop);
}
}

function quitGame(){
running=false;
stopMusic();
dead=false;
won=false;
gameMessage.classList.remove("show");
cancelAnimationFrame(animationFrame);
buildLevelList();
showScreen(levelsScreen);
}

document.addEventListener("keydown",event=>{
if(event.code==="Space"||event.code==="ArrowUp"||event.code==="KeyW"){
event.preventDefault();
if(!jumpHeld){
jumpHeld=true;
requestJump();
}
}
if(event.code==="KeyR"&&gameScreen.classList.contains("active")){
startLevel(currentLevel);
}
if(event.code==="Escape"&&gameScreen.classList.contains("active")){
quitGame();
}
});

document.addEventListener("keyup",event=>{
if(event.code==="Space"||event.code==="ArrowUp"||event.code==="KeyW"){
jumpHeld=false;
}
});

canvas.addEventListener("pointerdown",event=>{
if(!gameScreen.classList.contains("active"))return;
if(!jumpHeld){
jumpHeld=true;
requestJump();
}
});

canvas.addEventListener("pointerup",()=>jumpHeld=false);
canvas.addEventListener("pointercancel",()=>jumpHeld=false);

jumpButton.addEventListener("pointerdown",event=>{
event.preventDefault();
if(!jumpHeld){
jumpHeld=true;
requestJump();
}
});

jumpButton.addEventListener("pointerup",event=>{
event.preventDefault();
jumpHeld=false;
});

jumpButton.addEventListener("pointercancel",()=>jumpHeld=false);

restartButton.addEventListener("click",()=>startLevel(currentLevel));
quitButton.addEventListener("click",quitGame);

gameMessage.addEventListener("pointerdown",()=>{
if(dead){
startLevel(currentLevel);
}else if(won){
buildLevelList();
showScreen(levelsScreen);
}
});

playButton.addEventListener("click",()=>{
buildLevelList();
showScreen(levelsScreen);
});

levelsBack.addEventListener("click",()=>showScreen(home));

settingsButton.addEventListener("click",()=>settingsModal.classList.add("show"));
closeSettings.addEventListener("click",()=>settingsModal.classList.remove("show"));

soundToggle.addEventListener("click",()=>{
soundEnabled=!soundEnabled;
soundToggle.classList.toggle("on",soundEnabled);
if(soundEnabled){ensureAudio();startMusic();}else{stopMusic();}
try{localStorage.setItem("neonDashSound",soundEnabled?"on":"off");}catch(e){}
showToast(soundEnabled?"SOUND ON":"SOUND OFF");
});

musicToggle.addEventListener("click",()=>{
musicEnabled=!musicEnabled;
musicToggle.classList.toggle("on",musicEnabled);
if(musicEnabled){ensureAudio();startMusic();}else{stopMusic();}
try{localStorage.setItem("neonDashMusic",musicEnabled?"on":"off");}catch(e){}
showToast(musicEnabled?"MUSIC ON":"MUSIC OFF");
});

motionToggle.addEventListener("click",()=>{
reducedMotion=!reducedMotion;
motionToggle.classList.toggle("on",reducedMotion);
createStars("homeStars",100);
createStars("levelStars",80);
showToast(reducedMotion?"REDUCED MOTION ON":"REDUCED MOTION OFF");
});

window.addEventListener("blur",()=>{
jumpHeld=false;
});

soundToggle.classList.toggle("on",soundEnabled);
musicToggle.classList.toggle("on",musicEnabled);
buildLevelList();
</script>
