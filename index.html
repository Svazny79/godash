<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070713">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Neon Dash</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05050d;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* =========================================================
   BACKGROUND
========================================================= */

body{
    background:
        radial-gradient(circle at 50% 25%,#17134b 0%,#08081b 38%,#030308 100%);
}

.screen{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.grid{
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(rgba(91,239,255,.09) 1px,transparent 1px),
        linear-gradient(90deg,rgba(91,239,255,.09) 1px,transparent 1px);
    background-size:70px 70px;
    transform:perspective(500px) rotateX(62deg);
    transform-origin:center;
    animation:gridMove 4s linear infinite;
    opacity:.55;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 70px;
    }
}

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #fff;
    animation:starMove linear infinite;
}

@keyframes starMove{
    from{
        transform:translateY(0);
        opacity:.2;
    }
    50%{
        opacity:1;
    }
    to{
        transform:translateY(110vh);
        opacity:.1;
    }
}

/* =========================================================
   HOME
========================================================= */

#home{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.home-content{
    position:relative;
    z-index:5;
    width:min(900px,94vw);
}

.logo{
    font-size:clamp(58px,11vw,125px);
    font-weight:1000;
    font-style:italic;
    letter-spacing:-7px;
    line-height:.9;
    color:#fff;
    text-shadow:
        0 0 8px #63f5ff,
        0 0 30px #63f5ff,
        0 0 70px #714fff;
    animation:logoPulse 2.2s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        filter:brightness(1);
        transform:scale(1);
    }
    50%{
        filter:brightness(1.3);
        transform:scale(1.015);
    }
}

.subtitle{
    margin-top:18px;
    font-size:15px;
    font-weight:900;
    letter-spacing:8px;
    color:#8df8ff;
    text-shadow:0 0 15px #63f5ff;
}

.menu{
    margin:45px auto 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.neon-button{
    position:relative;
    width:min(360px,85vw);
    padding:17px 25px;
    border:2px solid #63f5ff;
    border-radius:14px;
    color:white;
    background:
        linear-gradient(135deg,
            rgba(99,245,255,.12),
            rgba(113,79,255,.18));
    box-shadow:
        0 0 15px rgba(99,245,255,.25),
        inset 0 0 20px rgba(99,245,255,.05);
    font-size:17px;
    font-weight:1000;
    letter-spacing:3px;
    cursor:pointer;
    transition:.2s;
    overflow:hidden;
}

.neon-button::before{
    content:"";
    position:absolute;
    left:-100%;
    top:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.2),
        transparent
    );
    transition:.45s;
}

.neon-button:hover::before{
    left:100%;
}

.neon-button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:
        0 0 25px rgba(99,245,255,.5),
        0 0 60px rgba(113,79,255,.25),
        inset 0 0 20px rgba(99,245,255,.1);
}

.neon-button:active{
    transform:scale(.97);
}

.stats{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

.stat{
    min-width:110px;
}

.stat-number{
    font-size:25px;
    font-weight:1000;
    color:#63f5ff;
    text-shadow:0 0 12px #63f5ff;
}

.stat-label{
    margin-top:4px;
    color:#8888a9;
    font-size:10px;
    letter-spacing:2px;
    font-weight:900;
}

/* =========================================================
   LEVEL SELECT
========================================================= */

#levels{
    display:none;
    padding:30px;
    overflow:auto;
}

.levels-wrap{
    position:relative;
    z-index:5;
    width:min(1050px,100%);
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:30px;
}

.page-title{
    font-size:clamp(30px,6vw,58px);
    font-weight:1000;
    font-style:italic;
    text-shadow:0 0 25px #63f5ff;
}

.back-button{
    padding:12px 18px;
    border:1px solid #63f5ff;
    border-radius:10px;
    color:white;
    background:#63f5ff12;
    cursor:pointer;
    font-weight:900;
}

.level-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.level-card{
    position:relative;
    min-height:220px;
    padding:22px;
    border:1px solid rgba(99,245,255,.3);
    border-radius:20px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );
    box-shadow:
        inset 0 0 30px rgba(99,245,255,.025),
        0 10px 40px rgba(0,0,0,.25);
    overflow:hidden;
    transition:.25s;
}

.level-card:hover{
    transform:translateY(-6px);
    border-color:#63f5ff;
    box-shadow:
        0 0 30px rgba(99,245,255,.18),
        inset 0 0 35px rgba(99,245,255,.04);
}

.level-number{
    font-size:12px;
    letter-spacing:3px;
    color:#7e7e9e;
    font-weight:900;
}

.level-name{
    margin-top:8px;
    font-size:25px;
    font-weight:1000;
}

.difficulty{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:7px;
    background:#63f5ff14;
    border:1px solid #63f5ff44;
    color:#63f5ff;
    font-size:10px;
    letter-spacing:2px;
    font-weight:1000;
}

.level-progress{
    margin-top:25px;
    height:8px;
    background:#ffffff0c;
    border-radius:20px;
    overflow:hidden;
}

.level-progress-fill{
    height:100%;
    width:0%;
    border-radius:20px;
    background:linear-gradient(90deg,#63f5ff,#714fff);
    box-shadow:0 0 12px #63f5ff;
}

.play-level{
    position:absolute;
    right:18px;
    bottom:18px;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid #63f5ff;
    color:white;
    background:#63f5ff14;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 15px #63f5ff33;
}

/* =========================================================
   GAME
========================================================= */

#game{
    display:none;
    background:#03030a;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

.hud{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    z-index:10;
    padding:18px 20px;
    pointer-events:none;
}

.hud-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.level-hud{
    font-weight:1000;
    letter-spacing:2px;
    text-shadow:0 0 10px #63f5ff;
}

.percent{
    font-size:18px;
    font-weight:1000;
}

.progress{
    margin-top:12px;
    width:100%;
    height:7px;
    border-radius:10px;
    overflow:hidden;
    background:#ffffff15;
    box-shadow:0 0 15px #000;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#63f5ff,#714fff,#ff38d8);
    box-shadow:0 0 15px #63f5ff;
}

.game-buttons{
    position:absolute;
    right:20px;
    top:65px;
    z-index:20;
    display:flex;
    gap:8px;
}

.game-small-button{
    border:1px solid #ffffff33;
    border-radius:8px;
    background:#00000055;
    color:white;
    padding:9px 12px;
    cursor:pointer;
    font-weight:900;
}

/* =========================================================
   MOBILE JUMP
========================================================= */

.mobile-control{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:30;

    width:150px;
    height:75px;

    border:2px solid #63f5ff;
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(99,245,255,.16),
            rgba(113,79,255,.2)
        );

    color:white;
    font-size:17px;
    font-weight:1000;
    letter-spacing:3px;

    box-shadow:
        0 0 25px #63f5ff55,
        inset 0 0 20px #63f5ff18;

    touch-action:none;
    user-select:none;
    cursor:pointer;
}

.mobile-control:active{
    transform:translateX(-50%) scale(.94);
    box-shadow:
        0 0 40px #63f5ff99,
        inset 0 0 30px #63f5ff33;
}

/* =========================================================
   GAME MESSAGE
========================================================= */

.game-message{
    position:absolute;
    inset:0;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(5px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.game-message.show{
    opacity:1;
    pointer-events:auto;
}

.message-box{
    width:min(500px,90vw);
    padding:35px;
    text-align:center;
    border:2px solid #63f5ff;
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(8,8,30,.96),
            rgba(13,8,36,.96)
        );
    box-shadow:
        0 0 50px rgba(99,245,255,.2),
        inset 0 0 30px rgba(99,245,255,.04);
}

.message-title{
    font-size:clamp(35px,7vw,65px);
    font-weight:1000;
    font-style:italic;
    text-shadow:0 0 25px #63f5ff;
}

.message-text{
    margin:12px 0 25px;
    color:#a6a6c0;
    font-weight:700;
}

.message-hint{
    color:#63f5ff;
    font-size:12px;
    font-weight:1000;
    letter-spacing:2px;
}

/* =========================================================
   SETTINGS
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,90vw);
    padding:30px;
    border:1px solid #63f5ff66;
    border-radius:20px;
    background:#09091a;
    box-shadow:0 0 60px #000;
}

.modal-title{
    font-size:30px;
    font-weight:1000;
    margin-bottom:25px;
}

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #ffffff0e;
}

.setting-label{
    color:#aaaac0;
    font-weight:700;
}

.toggle{
    width:50px;
    height:27px;
    border-radius:30px;
    background:#ffffff18;
    border:1px solid #ffffff22;
    cursor:pointer;
    position:relative;
}

.toggle-dot{
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#777;
    transition:.2s;
}

.toggle.active{
    background:#63f5ff33;
    border-color:#63f5ff;
}

.toggle.active .toggle-dot{
    left:26px;
    background:#63f5ff;
    box-shadow:0 0 12px #63f5ff;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){
    .level-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:560px){
    .level-grid{
        grid-template-columns:1fr;
    }

    #levels{
        padding:18px;
    }

    .logo{
        letter-spacing:-4px;
    }

    .subtitle{
        font-size:11px;
        letter-spacing:5px;
    }

    .stats{
        gap:18px;
    }

    .game-buttons{
        top:65px;
        right:10px;
    }

    .game-small-button{
        padding:7px 9px;
        font-size:11px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

======================================================= -->

</section>


<!-- =======================================================
     GAME
======================================================= -->

<section id="game" class="screen">

            ✕

    </div>

    <button
        id="jumpButton"

        JUMP
    </button>

    <div
        class="game-message"
        id="gameMessage">

        <div class="message-box">

            <div
                class="message-title"
                id="messageTitle">
                CRASHED
            </div>

            <div
                class="message-text"
                id="messageText">
                Try again.
            </div>

            <div class="message-hint">
                TAP / SPACE TO CONTINUE
            </div>

        </div>

    </div>

</section>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div class="modal" id="settingsModal">

    <div class="modal-box">

        <div class="modal-title">
            SETTINGS

        <div class="setting-row">

            <div class="setting-label">
                Reduced Motion
            </div>

            <div
                class="toggle"
                id="motionToggle"

            </div>

        </div>

        <div class="setting-row">

            <div class="setting-label">
                Sound
            </div>

            <div
                class="toggle active"
                id="soundToggle"
                onclick="toggleSound()">

                <div class="toggle-dot"></div>

            </div>

        </div>

        <br>

        <button
            class="neon-button"
            style="width:100%;"
            onclick="closeSettings()">
            CLOSE
        </button>

    </div>

</div>

/* =========================================================
   SAVE SYSTEM
========================================================= */

const SAVE_KEY = "neonDashSave";

const defaultSave = {
    level:1,
    stars:0,
    attempts:0,
    best:{}
};

let save;

try{
    save = JSON.parse(
        localStorage.getItem(SAVE_KEY)
    ) || structuredClone(defaultSave);
}catch{
    save = structuredClone(defaultSave);
}

if(!save.best){
    save.best = {};
}

function saveGame(){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(save)
    );

    updateHomeStats();
}

function updateHomeStats(){

    document.getElementById("homeLevel").textContent =
        save.level;

    document.getElementById("homeStars").textContent =
        save.stars;

    document.getElementById("homeAttempts").textContent =
        save.attempts;
}


/* =========================================================
   STARS BACKGROUND
========================================================= */

function createStars(containerId,count=80){

    const container =
        document.getElementById(containerId);

    if(!container)return;

    container.innerHTML="";

    for(let i=0;i<count;i++){

        const star =
            document.createElement("div");

        star.className="star";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*100+"%";

        const size =
            Math.random()*3+1;

        star.style.width=size+"px";
        star.style.height=size+"px";

        star.style.animationDuration =
            (Math.random()*5+3)+"s";

        star.style.animationDelay =
            (-Math.random()*8)+"s";

        container.appendChild(star);
    }
}

/* =========================================================

========================================================= */

function hideAllScreens(){

    document.getElementById("home").style.display="none";
    document.getElementById("levels").style.display="none";
    document.getElementById("game").style.display="none";
}

function showHome(){

    stopGame();

    hideAllScreens();

    document.getElementById("home").style.display="flex";

    updateHomeStats();
}

function showLevels(){

    stopGame();

    hideAllScreens();

    document.getElementById("levels").style.display="block";

    buildLevelCards();
}


/* =========================================================
   LEVEL CARDS
========================================================= */

function buildLevelCards(){

    const grid =
        document.getElementById("levelGrid");

    grid.innerHTML="";

    levelsData.forEach((level,index)=>{

        const unlocked =
            index+1 <= save.level;

        const best =
            save.best[level.id] || 0;

        const card =
            document.createElement("div");

        card.className="level-card";

        card.style.borderColor =
            unlocked
            ? level.color+"66"
            : "#ffffff12";

        card.innerHTML=`

            <div class="level-number">
                LEVEL ${level.id}
            </div>

            <div
                class="level-name"
                style="text-shadow:0 0 15px ${level.color}">
                ${level.name}
            </div>

            <div
                class="difficulty"
                style="
                    color:${level.color};
                    border-color:${level.color}55;
                    background:${level.color}12;
                ">
                ${level.difficulty}
            </div>

            <div class="level-progress">
                <div
                    class="level-progress-fill"
                    style="
                        width:${best}%;
                        background:
                        linear-gradient(
                            90deg,
                            ${level.color},
                            #714fff
                        );
                    ">
                </div>
            </div>

            <div
                style="
                    position:absolute;
                    left:22px;
                    bottom:21px;
                    color:#777791;
                    font-size:11px;
                    font-weight:900;
                ">
                BEST ${best}%
            </div>

            <button
                class="play-level"
                ${!unlocked ? "disabled" : ""}
                onclick="startLevel(${index})"
                style="
                    border-color:${unlocked ? level.color : "#555"};
                    opacity:${unlocked ? "1" : ".35"};
                ">
                ${unlocked ? "▶" : "🔒"}
            </button>
        `;

        grid.appendChild(card);
    });
}

const canvas =

    canvas.getContext("2d");

let H=window.innerHeight;

let currentLevel=0;
let levelData=null;

let playing=false;
let dead=false;
let completed=false;

let cameraX=0;

let particles=[];
let shake=0;

let animationId=null;

let jumpHeld=false;
let jumpBuffer=0;
let coyoteTime=0;

let soundEnabled=true;

let player={
    x:220,
    y:0,
    size:38,
    vy:0,
    grounded:false,
    rotation:0
};


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

    const dpr =
        Math.min(window.devicePixelRatio || 1,2);

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(index){

    if(index<0 || index>=levelsData.length){
        return;
    }

    currentLevel=index;
    levelData=levelsData[index];

    hideAllScreens();

    document.getElementById("game").style.display="block";

    player.x=220;
    player.y=H-95-38;
    player.vy=0;
    player.grounded=true;
    player.rotation=0;

    cameraX=0;

    particles=[];
    shake=0;

    playing=true;
    dead=false;
    completed=false;

    jumpHeld=false;
    jumpBuffer=0;
    coyoteTime=5;

    save.attempts++;

    saveGame();

    document.getElementById("levelName").textContent =
        levelData.name;

    document.getElementById("levelName").style.textShadow =
        `0 0 15px ${levelData.color}`;

    document.getElementById("percent").textContent="0%";

    document.getElementById("progressFill").style.width="0%";

    hideMessage();

    cancelAnimationFrame(animationId);

    gameLoop();
}


/* =========================================================
   RESTART
========================================================= */

function restartLevel(){

    if(levelData){
        startLevel(currentLevel);
    }
}


/* =========================================================
   STOP GAME
========================================================= */

function stopGame(){

    playing=false;

    cancelAnimationFrame(animationId);
}


/* =========================================================
   QUIT
========================================================= */

function quitGame(){

    stopGame();

    showLevels();
}


/* =========================================================
   INPUT SYSTEM
========================================================= */

/*
    Classic one-button controls:

    Space
    W
    Arrow Up
    Mouse click
    Touch
    Mobile JUMP button

    One press = one jump.
    Holding the button does not create repeated jumps.
*/

function pressJump(){

    if(dead || completed){

        if(dead){
            restartLevel();
        }else if(completed){
            showLevels();
        }

        return;
    }

    if(!playing){
        return;
    }

    if(jumpHeld){
        return;
    }

    jumpHeld=true;

    jumpBuffer=6;

    attemptJump();
}


function releaseJump(){

    jumpHeld=false;
}


function attemptJump(){

    if(!playing){
        return;
    }

    if(
        player.grounded ||
        coyoteTime>0
    ){

        player.vy=-15.5;

        player.grounded=false;

        coyoteTime=0;

        jumpBuffer=0;

        createJumpParticles();

        flashScreen();
    }
}


/* KEYBOARD */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            if(!e.repeat){
                pressJump();
            }
        }

        if(e.code==="KeyR"){

            e.preventDefault();

            restartLevel();
        }
    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.code==="Space" ||
            e.code==="ArrowUp" ||
            e.code==="KeyW"
        ){

            e.preventDefault();

            releaseJump();
        }
    }
);


/* MOUSE */

canvas.addEventListener(
    "pointerdown",
    function(e){

        if(e.pointerType==="mouse" && e.button!==0){
            return;
        }

        pressJump();
    }
);

canvas.addEventListener(
    "pointerup",
    releaseJump
);

canvas.addEventListener(
    "pointercancel",
    releaseJump
);


/* MOBILE BUTTON */

const jumpButton =
    document.getElementById("jumpButton");

jumpButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        pressJump();
    }
);

jumpButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        releaseJump();
    }
);

jumpButton.addEventListener(
    "pointercancel",
    releaseJump
);

jumpButton.addEventListener(
    "pointerleave",
    releaseJump
);


/* Prevent touch scrolling */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            document.getElementById("game").style.display !== "none"
        ){
            e.preventDefault();
        }

    },
    {passive:false}
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(){

    update();

    draw();

    if(playing){

        animationId =
            requestAnimationFrame(gameLoop);
    }
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(!playing){
        return;
    }

    /* -----------------------------------------
       INPUT BUFFER
    ----------------------------------------- */

    if(jumpBuffer>0){

        jumpBuffer--;

        attemptJump();
    }


    /* -----------------------------------------
       PHYSICS
    ----------------------------------------- */

    const gravity=.82;

    player.vy += gravity;

    player.y += player.vy;


    const ground =
        H-95;


    const wasGrounded =
        player.grounded;

    player.grounded=false;


    /* Ground collision */

    if(
        player.y + player.size >= ground
    ){

        player.y =
            ground-player.size;

        player.vy=0;

        player.grounded=true;

        coyoteTime=5;
    }
    else{

        if(coyoteTime>0){
            coyoteTime--;
        }
    }


    /* -----------------------------------------
       AUTO RUN
    ----------------------------------------- */

    player.x += levelData.speed;


    /* -----------------------------------------
       CAMERA
    ----------------------------------------- */

    cameraX =
        player.x-W*.25;


    if(cameraX<0){
        cameraX=0;
    }


    /* -----------------------------------------
       ROTATION
    ----------------------------------------- */

    if(!player.grounded){

        player.rotation += .14;
    }
    else{

        const quarter =
            Math.PI/2;

        player.rotation =
            Math.round(
                player.rotation/quarter
            )*quarter;
    }


    /* -----------------------------------------
       COLLISION WITH BLOCKS
    ----------------------------------------- */

    for(const block of levelData.blocks){

        const bx =
            block.x-cameraX;

        const by =
            ground-block.h;

        const bw=80;
        const bh=block.h;

        const px=player.x-cameraX;
        const py=player.y;
        const ps=player.size;


        const hit =
            px < bx+bw &&
            px+ps > bx &&
            py < by+bh &&
            py+ps > by;


        if(hit){

            /*
                If the player is falling and is above
                the block, allow a landing.
            */

            const previousBottom =
                py- player.vy + ps;

            if(
                player.vy>=0 &&
                previousBottom<=by+8
            ){

                player.y =
                    by-ps;

                player.vy=0;

                player.grounded=true;

                coyoteTime=5;
            }
            else{

                die();

                return;
            }
        }
    }


    /* -----------------------------------------
       SPIKE COLLISION
    ----------------------------------------- */

    for(const spikeX of levelData.spikes){

        const sx =
            spikeX-cameraX;

        if(
            sx<-80 ||
            sx>W+80
        ){
            continue;
        }

        const spikeY =
            ground-42;

        const px =
            player.x-cameraX;

        const py =
            player.y;

        const ps =
            player.size;


        /*
            Slightly smaller hitbox than visual box
            makes controls feel more forgiving.
        */

        const hitboxPadding=7;

        const hit =
            px+hitboxPadding < sx+40 &&
            px+ps-hitboxPadding > sx &&
            py+hitboxPadding < spikeY+42 &&
            py+ps-hitboxPadding > spikeY+10;


        if(hit){

            die();

            return;
        }
    }


    /* -----------------------------------------
       PARTICLES
    ----------------------------------------- */

    updateParticles();


    /* -----------------------------------------
       SHAKE
    ----------------------------------------- */

    if(shake>0){
        shake--;
    }


    /* -----------------------------------------
       PROGRESS
    ----------------------------------------- */

    const progress =
        Math.max(
            0,
            Math.min(
                100,
                ((player.x-220) /
                (levelData.length-220))*100
            )
        );

    document.getElementById("percent").textContent =
        Math.floor(progress)+"%";

    document.getElementById("progressFill").style.width =
        progress+"%";


    /* -----------------------------------------
       WIN
    ----------------------------------------- */

    if(player.x>=levelData.length){

        win();
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    let sx=0;
    let sy=0;

    if(shake>0){

        sx =
            (Math.random()-.5)*10;

        sy =
            (Math.random()-.5)*10;
    }

    ctx.save();

    ctx.translate(
        sx,
        sy
    );

    drawBackground();

    drawWorld();

    drawParticles();

    drawPlayer();

    ctx.restore();
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const color =
        levelData
        ? levelData.color
        : "#714fff";


    /* Sky */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#07071b"
    );

    gradient.addColorStop(
        .6,
        "#09051a"
    );

    gradient.addColorStop(
        1,
        "#030308"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Large glow */

    const glow =
        ctx.createRadialGradient(
            W*.55,
            H*.4,
            10,
            W*.55,
            H*.4,
            W*.65
        );

    glow.addColorStop(
        0,
        color+"22"
    );

    glow.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Background grid */

    ctx.save();

    ctx.globalAlpha=.15;

    ctx.strokeStyle=color;

    ctx.lineWidth=1;

    const gridSize=70;

    const offsetX =
        -(cameraX*.25)%gridSize;

    for(
        let x=offsetX;
        x<W;
        x+=gridSize
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }

    for(
        let y=70;
        y<H;
        y+=gridSize
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }

    ctx.restore();


    /* Distant skyline */

    ctx.save();

    ctx.globalAlpha=.15;

    for(
        let i=0;
        i<25;
        i++
    ){

        const buildingWidth=45;

        const x =
            ((i*170)-(cameraX*.15)) %
            (W+250);

        const normalizedX =
            x<0
            ? x+W+250
            : x;

        const height =
            60+(i%6)*30;

        ctx.fillStyle=color;

        ctx.fillRect(
            normalizedX,
            H-95-height,
            buildingWidth,
            height
        );
    }

    ctx.restore();
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    const color =
        levelData.color;

    const ground =
        H-95;


    /* Ground */

    const groundGradient =
        ctx.createLinearGradient(
            0,
            ground,
            0,
            H
        );

    groundGradient.addColorStop(
        0,
        color+"55"
    );

    groundGradient.addColorStop(
        1,
        "#030308"
    );

    ctx.fillStyle =
        groundGradient;

    ctx.fillRect(
        0,
        ground,
        W,
        H-ground
    );


    /* Ground glow */

    ctx.shadowBlur=20;

    ctx.shadowColor=color;

    ctx.strokeStyle=color;

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        ground
    );

    ctx.lineTo(
        W,
        ground
    );

    ctx.stroke();

    ctx.shadowBlur=0;


    /* Ground lines */

    ctx.globalAlpha=.25;

    ctx.lineWidth=1;

    const spacing=50;

    const offset =
        -(cameraX*.7)%spacing;

    for(
        let x=offset;
        x<W;
        x+=spacing
    ){

        ctx.strokeStyle=color;

        ctx.beginPath();

        ctx.moveTo(
            x,
            ground
        );

        ctx.lineTo(
            x-80,
            H
        );

        ctx.stroke();
    }

    ctx.globalAlpha=1;


    /* Blocks */

    for(const block of levelData.blocks){

        const x =
            block.x-cameraX;

        const y =
            ground-block.h;

        const width=80;

        if(
            x>W+100 ||
            x<-100
        ){
            continue;
        }

        const grad =
            ctx.createLinearGradient(
                x,
                y,
                x,
                ground
            );

        grad.addColorStop(
            0,
            color+"bb"
        );

        grad.addColorStop(
            1,
            color+"22"
        );

        ctx.fillStyle=grad;

        ctx.fillRect(
            x,
            y,
            width,
            block.h
        );


        ctx.strokeStyle=color;

        ctx.lineWidth=2;

        ctx.shadowBlur=15;

        ctx.shadowColor=color;

        ctx.strokeRect(
            x,
            y,
            width,
            block.h
        );

        ctx.shadowBlur=0;


        /* Block top */

        ctx.fillStyle=color;

        ctx.fillRect(
            x,
            y,
            width,
            5
        );


        /* Block details */

        ctx.globalAlpha=.35;

        ctx.fillStyle="#fff";

        for(
            let yy=y+18;
            yy<ground;
            yy+=24
        ){

            ctx.fillRect(
                x+10,
                yy,
                5,
                5
            );

            ctx.fillRect(
                x+35,
                yy,
                5,
                5
            );

            ctx.fillRect(
                x+60,
                yy,
                5,
                5
            );
        }

        ctx.globalAlpha=1;
    }


    /* Spikes */

    for(const spikeX of levelData.spikes){

        const x =
            spikeX-cameraX;

        if(
            x<-80 ||
            x>W+80
        ){
            continue;
        }

        drawSpike(
            x,
            ground,
            color
        );
    }


    /* Finish portal */

    const finishX =
        levelData.length-cameraX;

    if(
        finishX>-100 &&
        finishX<W+100
    ){

        ctx.save();

        ctx.translate(
            finishX,
            ground-100
        );

        ctx.strokeStyle="#fff";

        ctx.lineWidth=5;

        ctx.shadowBlur=25;

        ctx.shadowColor=color;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            65,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.strokeStyle=color;

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            45,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   SPIKE
========================================================= */

function drawSpike(
    x,
    ground,
    color
){

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        x,
        ground
    );

    ctx.lineTo(
        x+20,
        ground-43
    );

    ctx.lineTo(
        x+40,
        ground
    );

    ctx.closePath();

    const gradient =
        ctx.createLinearGradient(
            x,
            ground-43,
            x,
            ground
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .2,
        color
    );

    gradient.addColorStop(
        1,
        color+"22"
    );

    ctx.fillStyle=gradient;

    ctx.shadowBlur=18;

    ctx.shadowColor=color;

    ctx.fill();

    ctx.strokeStyle=color;

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const color =
        levelData.color;

    const px =
        player.x-cameraX;

    const py =
        player.y;

    const s =
        player.size;


    ctx.save();

    ctx.translate(
        px+s/2,
        py+s/2
    );

    ctx.rotate(
        player.rotation
    );


    /* Glow */

    ctx.shadowBlur=25;

    ctx.shadowColor=color;


    /* Outer cube */

    const gradient =
        ctx.createLinearGradient(
            -s/2,
            -s/2,
            s/2,
            s/2
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .25,
        color
    );

    gradient.addColorStop(
        1,
        "#15152c"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        -s/2,
        -s/2,
        s,
        s
    );


    /* Border */

    ctx.strokeStyle="#fff";

    ctx.lineWidth=3;

    ctx.strokeRect(
        -s/2,
        -s/2,
        s,
        s
    );


    /* Face */

    ctx.shadowBlur=0;

    ctx.fillStyle="#05050c";

    ctx.fillRect(
        -11,
        -9,
        7,
        9
    );

    ctx.fillRect(
        4,
        -9,
        7,
        9
    );


    /* Mouth */

    ctx.fillRect(
        -9,
        6,
        18,
        4
    );


    /* Highlight */

    ctx.fillStyle="#fff";

    ctx.globalAlpha=.8;

    ctx.fillRect(
        -s/2+5,
        -s/2+5,
        7,
        4
    );

    ctx.globalAlpha=1;

    ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

function createJumpParticles(){

    const px =
        player.x-cameraX;

    const py =
        player.y+player.size;

    for(
        let i=0;
        i<12;
        i++
    ){

        particles.push({

            x:px,
            y:py,

            vx:(Math.random()-.5)*5,

            vy:Math.random()*-3,

            size:Math.random()*5+2,

            life:1,

            color:levelData.color
        });
    }
}


function createDeathParticles(){

    const px =
        player.x-cameraX;

    const py =
        player.y+player.size/2;

    for(
        let i=0;
        i<45;
        i++
    ){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            Math.random()*9+2;

        particles.push({

            x:px,
            y:py,

            vx:Math.cos(angle)*speed,

            vy:Math.sin(angle)*speed,

            size:Math.random()*7+2,

            life:1,

            color:
                Math.random()>.5
                ? levelData.color
                : "#fff"
        });
    }
}


function createWinParticles(){

    for(
        let i=0;
        i<100;
        i++
    ){

        particles.push({

            x:
                player.x-cameraX,

            y:
                player.y,

            vx:
                (Math.random()-.5)*14,

            vy:
                (Math.random()-.5)*14,

            size:
                Math.random()*8+2,

            life:1,

            color:
                Math.random()>.5
                ? levelData.color
                : "#fff"
        });
    }
}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.25;

        p.life-=.025;

        p.size*=.98;

        if(p.life<=0){

            particles.splice(
                i,
                1
            );
        }
    }
}


function drawParticles(){

    for(const p of particles){

        ctx.save();

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur=12;

        ctx.shadowColor =
            p.color;

        ctx.fillRect(
            p.x-p.size/2,
            p.y-p.size/2,
            p.size,
            p.size
        );

        ctx.restore();
    }
}


/* =========================================================
   DEATH
========================================================= */

function die(){

    if(dead || completed){
        return;
    }

    dead=true;
    playing=false;

    createDeathParticles();

    shake=15;

    showMessage(
        "CRASHED",
        "You made it to "+getProgress()+"%.",
        true
    );
}


/* =========================================================
   WIN
========================================================= */

function win(){

    if(completed){
        return;
    }

    completed=true;
    playing=false;

    createWinParticles();

    save.stars++;

    if(currentLevel+1>=save.level){

        save.level =
            Math.min(
                levelsData.length,
                currentLevel+2
            );
    }

    save.best[levelData.id]=100;

    saveGame();

    showMessage(
        "LEVEL COMPLETE!",
        "You beat "+levelData.name+".",
        false
    );
}


/* =========================================================
   PROGRESS
========================================================= */

function getProgress(){

    if(!levelData){
        return 0;
    }

    return Math.floor(
        Math.max(
            0,
            Math.min(
                100,
                ((player.x-220) /
                (levelData.length-220))*100
            )
        )
    );
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    title,
    text,
    crashed
){

    document.getElementById(
        "messageTitle"
    ).textContent=title;

    document.getElementById(
        "messageText"
    ).textContent=text;

    const box =
        document.querySelector(
            ".message-box"
        );

    if(crashed){

        box.style.borderColor =
            "#ff3d71";

        box.style.boxShadow =
            "0 0 50px #ff3d7133";
    }
    else{

        box.style.borderColor =
            levelData.color;

        box.style.boxShadow =
            `0 0 50px ${levelData.color}44`;
    }

    document.getElementById(
        "gameMessage"
    ).classList.add("show");
}


function hideMessage(){

    document.getElementById(
        "gameMessage"
    ).classList.remove("show");
}


/* =========================================================
   MESSAGE CLICK
========================================================= */

document.getElementById(
    "gameMessage"
).addEventListener(
    "pointerdown",
    function(){

        if(dead){

            restartLevel();

        }else if(completed){

            showLevels();
        }
    }
);


/* =========================================================
   FLASH
========================================================= */

function flashScreen(){

    const flash =
        document.getElementById("flash");

    /*
       The original game doesn't need a visible flash
       element. Use a quick canvas overlay instead.
    */

    ctx.save();

    ctx.fillStyle =
        levelData.color+"12";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.restore();
}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

    document.getElementById(
        "settingsModal"
    ).classList.add("show");
}


function closeSettings(){

    document.getElementById(
        "settingsModal"
    ).classList.remove("show");
}


function toggleSound(){

    soundEnabled =
        !soundEnabled;

    document.getElementById(
        "soundToggle"
    ).classList.toggle(
        "active",
        soundEnabled
    );
}


function toggleMotion(){

    document.getElementById(
        "motionToggle"
    ).classList.toggle(
        "active"
    );

    document.body.classList.toggle(
        "reduced-motion"
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

updateHomeStats();


/* =========================================================
   PERIODIC BACKGROUND PARTICLES
========================================================= */

setInterval(
    function(){

        if(
            !playing ||
            !levelData
        ){
            return;
        }

        for(
            let i=0;
            i<2;
            i++
        ){

            particles.push({

                x:
                    Math.random()*W,

                y:
                    Math.random()*(H-150),

                vx:-.3,

                vy:.15,

                size:
                    Math.random()*2+1,

                life:.8,

                color:
                    levelData.color
            });
        }

    },
    100
);


/* =========================================================
   AUTO SAVE BEFORE LEAVING
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        saveGame();
    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(e.code==="Escape"){

            if(
                document.getElementById(
                    "settingsModal"
                ).classList.contains("show")
            ){

                closeSettings();

                return;
            }

            if(
                document.getElementById(
                    "game"
                ).style.display !== "none"
            ){

                quitGame();
            }
        }
    }
);

</script>
